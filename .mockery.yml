all: false
dir: internal/repository/mocks
filename: '{{.InterfaceName}}.go'
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/usesnipet/snipet
generate: true
include-auto-generated: false
log-level: info
structname: 'Mock{{.InterfaceName}}'
pkgname: mocks
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/usesnipet/snipet/internal/repository:
    config:
      include-interface-regex: '^I([A-Z].*Repository|TxManager)$'
      exclude-interface-regex: '^I(Filterable|Findable|Creatable|Updatable|Deletable)Repository$|^IRepository$'
  github.com/usesnipet/snipet/internal/runtime:
    config:
      dir: internal/runtime/mocks
      include-interface-regex: '^I(SourceDriver|IndexDriver)$'
  github.com/usesnipet/snipet/internal/queue:
    config:
      dir: internal/queue/mocks
      include-interface-regex: '^IJobQueue$'
