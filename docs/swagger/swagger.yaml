info:
  contact: {}
  description: API for the Snipet platform.
  title: Snipet API
  version: "1.0"
paths:
  /agents:
    get:
      description: Lists agents.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentsPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
      summary: List agents
      tags:
      - agent
    post:
      consumes:
      - application/json
      description: Creates a new agent.
      parameters:
      - description: Agent data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAgentDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BasicAuth: []
