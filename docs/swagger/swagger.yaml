      expires_at:
        type: string
      id:
        type: string
      key_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  APIKeyResponse:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      key_id:
        type: string
      name:
        type: string
      updated_at:
        type: string
