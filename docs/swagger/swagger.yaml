info:
  contact: {}
  description: API for the Snipet platform.
  title: Snipet API
  version: "1.0"
paths:
  /agent:
    get:
      description: Lists agents.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentsPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: List agents
      tags:
      - agent
    post:
      consumes:
      - application/json
      description: Creates a new agent.
      parameters:
      - description: Agent data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAgentDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Create agent
      tags:
      - agent
  /agent/{id}:
    delete:
      description: Deletes an agent by ID.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Delete agent
      tags:
      - agent
    get:
      description: Returns an agent by ID.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AgentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Get agent
      tags:
      - agent
    put:
      consumes:
      - application/json
      description: Updates an agent by ID.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Agent data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateAgentDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Update agent
      tags:
      - agent
  /agent/{id}/run:
    post:
      consumes:
      - application/json
      description: Runs an agent in playground mode, streaming the execution via SSE.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Run input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RunAgentDTO'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Run agent
      tags:
      - agent
  /api-key:
    get:
      description: Lists API keys, with optional pagination.
      parameters:
      - description: Page size
        in: query
        name: take
        type: integer
      - description: Page offset
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeysPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: List API keys
      tags:
      - api-key
    post:
      consumes:
      - application/json
      description: Creates a new API key. The plaintext key is only returned once,
        on creation.
      parameters:
      - description: API key data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAPIKeyDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/APIKeyWithSecret'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Create API key
      tags:
      - api-key
  /api-key/{id}:
    delete:
      description: Deletes an API key by ID.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Delete API key
      tags:
      - api-key
    get:
      description: Returns an API key by ID.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeyResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Get API key
      tags:
      - api-key
  /api-key/{id}/active:
    put:
      description: Marks an API key as active.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Activate API key
      tags:
      - api-key
  /api-key/{id}/disabled:
    put:
      description: Marks an API key as disabled.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Disable API key
      tags:
      - api-key
  /api-key/{id}/expiration:
    put:
      consumes:
      - application/json
      description: Updates the expiration date of an API key.
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      - description: Expiration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateExpirationDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Update API key expiration
      tags:
