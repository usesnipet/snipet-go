  LLM:
    properties:
      configuration:
        $ref: '#/definitions/JSONMap'
      id:
        type: string
      name:
        type: string
      provider:
        type: string
    type: object
  LLMResponse:
    properties:
      configuration:
        $ref: '#/definitions/JSONMap'
      id:
        type: string
      name:
        type: string
      provider:
        type: string
