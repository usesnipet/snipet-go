info:
  contact: {}
  description: API for the Snipet platform.
  title: Snipet API
  version: "1.0"
paths:
  /agent/{id}/run:
    post:
      consumes:
      - application/json
      description: Runs an agent in playground mode, streaming the execution via SSE.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Run input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RunAgentDTO'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Run agent
      tags:
      - agent
  /api-key/me:
    get:
      description: Returns the API key used to authenticate the current request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIKeyResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      security:
      - ApiKeyAuth: []
      summary: Get current API key
      tags:
      - api-key
  /apps/{code}:
    get:
      description: Returns an app's name, code, and description. Only exposed when
        the app is marked public; otherwise 404. Unauthenticated.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PublicAppDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      summary: Get public app info
      tags:
      - app
  /apps/{code}/authenticate/{provider_name}:
    post:
      description: Authenticates an app user through the given auth provider (e.g.
        oidc, webhook).
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Auth provider name
        in: path
        name: provider_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthenticateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      summary: Authenticate with provider
      tags:
      - auth
  /apps/{code}/ping:
    post:
      description: Called by a connected app, authenticated with its own key, to confirm
        it's alive. Promotes a pending app to active on first success.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
      security:
      - AppKeyAuth: []
      summary: Ping
      tags:
      - app
  /apps/{code}/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new access/refresh token pair.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RefreshDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthenticateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      summary: Refresh access token
      tags:
      - auth
  /apps/{code}/session:
    get:
      description: Lists sessions of an app, with optional pagination and includes.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Page size
        in: query
        name: take
        type: integer
      - description: Page offset
        in: query
        name: skip
        type: integer
      - collectionFormat: csv
        description: Related resources to include
        in: query
        items:
          enum:
          - agent
          type: string
        name: include
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SessionsPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List sessions
      tags:
      - session
    post:
      consumes:
      - application/json
      description: Creates a new session for an app.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateSessionDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Create session
      tags:
      - session
  /apps/{code}/session/{id}:
    delete:
      description: Deletes a session by ID.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Delete session
      tags:
      - session
    get:
      description: Returns a session by ID.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - collectionFormat: csv
        description: Related resources to include
        in: query
        items:
          enum:
          - agent
          type: string
        name: include
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SessionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Get session
      tags:
      - session
    put:
      consumes:
      - application/json
      description: Updates a session by ID.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Session data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateSessionDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Update session
      tags:
      - session
  /apps/{code}/session/{id}/messages:
    get:
      description: Lists the execution messages of a session, with optional ordering/pagination.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Order by timestamp
        enum:
        - asc
        - desc
        in: query
        name: sort
        type: string
      - description: Page size
        in: query
        name: take
        type: integer
      - description: Page offset
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SessionMessagesPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: List session messages
      tags:
      - session
  /apps/{code}/session/{id}/run:
    post:
      consumes:
      - application/json
      description: Runs an agent within a session, streaming the execution via SSE.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Run input
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RunSessionDTO'
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Run session
      tags:
      - session
  /apps/{code}/user:
    get:
      description: Lists users of an app, with optional ordering/pagination.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: Order by name
        enum:
        - asc
        - desc
        in: query
        name: name_order
        type: string
      - description: Page size
        in: query
        name: take
        type: integer
      - description: Page offset
        in: query
        name: skip
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppUsersPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - AppKeyAuth: []
      summary: List users
      tags:
      - user
  /apps/{code}/user/authenticated:
    post:
      consumes:
      - application/json
      description: Creates an app user via the app's own key (server-to-server).
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreateAppUserDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      security:
      - AppKeyAuth: []
      summary: Create user
      tags:
      - user
  /apps/{code}/user/me:
    get:
      description: Returns the authenticated user for the given app.
      parameters:
      - description: App code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - user
  /auth/{provider}:
    get:
      description: Returns the authorization URL to start an OAuth login with the
        given provider.
      parameters:
      - description: Provider name
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/Error'
      summary: OAuth authorization URL
      tags:
      - auth
  /auth/{provider}/callback:
    get:
      description: Completes an OAuth login/link for the given provider.
      parameters:
      - description: Provider name
        enum:
        - google
        - github
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State
        in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthenticateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      summary: OAuth callback
      tags:
      - auth
  /auth/activate:
    post:
      consumes:
      - application/json
      description: Activates an account via an emailed activation token.
      parameters:
      - description: Activation token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ActivateAccountDTO'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/Error'
      summary: Activate account
      tags:
      - auth
  /auth/activate/resend:
    post:
      consumes:
      - application/json
      description: Always succeeds; re-issues the activation email if the email is
        registered.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/ResendActivationDTO'
      responses:
        "204":
          description: No Content
      summary: Resend activation
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in with email + password. Blocked until the account is activated.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AuthenticateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
      summary: Login
