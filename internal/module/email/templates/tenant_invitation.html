<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>You've been invited</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; padding:32px;">
            <tr>
              <td>
                <h1 style="font-size:20px; color:#18181b; margin:0 0 16px;">You've been invited to {{.TenantName}}</h1>
                <p style="font-size:14px; color:#3f3f46; line-height:1.5; margin:0 0 24px;">
                  {{.InviterName}} invited you to join <strong>{{.TenantName}}</strong> on Snipet. Click the button below to accept.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{.Link}}" style="display:inline-block; background-color:#18181b; color:#ffffff; text-decoration:none; padding:10px 20px; border-radius:6px; font-size:14px;">
                    Accept invitation
                  </a>
                </p>
                <p style="font-size:12px; color:#71717a; line-height:1.5; margin:0;">
                  If you weren't expecting this invitation, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
